<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fotolibro Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Serif+Display:ital@0;1&family=Lora:ital,wght@0,400;0,700;1,400;1,700&family=Montserrat:ital,wght@0,400;0,700;1,400&family=Josefin+Sans:ital,wght@0,400;0,700;1,400&family=Oswald:wght@400;700&family=Bebas+Neue&family=Roboto+Slab:wght@400;700&family=Great+Vibes&family=Dancing+Script:wght@400;700&family=Caveat:wght@400;700&family=Pacifico&family=Amatic+SC:wght@400;700&family=Fredoka:wght@400;600;700&family=Mountains+of+Christmas:wght@400;700&display=swap">
<style>
/* Fotolibro Studio — banco di lavoro: strumenti | libro aperto + striscia delle pagine | proprietà */
:root{
  /* palette "gallery neutral" (ui-ux-pro-max: Photography/Portfolio · Museum/Gallery):
     interfaccia calda e sobria, le foto restano protagoniste; il palco resta quasi neutro per giudicare i colori */
  --bg:#EFEDE9; --panel:#FAF9F7; --raise:#FFFFFF; --ink:#1C1A17; --muted:#5E5850; --line:#DDD8D0;
  --accent:#A63A1E; --accent-ink:#FFFFFF; --soft:#F5E7E1; --stage:#D3D1CD;
  --ok:#2E7D4F; --warn:#865000; --bad:#B3261E;
  --f-ui:"Inter","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,"Courier New",monospace;
  --f-brand:"Playfair Display",Georgia,serif;
  --z-top:5; --z-start:40; --z-toast:50;
  --ease:cubic-bezier(.2,.7,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141312; --panel:#1C1B19; --raise:#25231F; --ink:#ECE8E2; --muted:#A39C92; --line:#34312C;
    --accent:#F08A64; --accent-ink:#1A0C06; --soft:#3A2820; --stage:#0E0D0C;
    --ok:#5FC08A; --warn:#E3A13D; --bad:#EF6B6B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141312; --panel:#1C1B19; --raise:#25231F; --ink:#ECE8E2; --muted:#A39C92; --line:#34312C;
    --accent:#F08A64; --accent-ink:#1A0C06; --soft:#3A2820; --stage:#0E0D0C;
    --ok:#5FC08A; --warn:#E3A13D; --bad:#EF6B6B; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 var(--f-ui);display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}

.top{display:flex;align-items:center;gap:10px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-family:var(--f-brand);font-weight:700;font-size:17px;letter-spacing:-.015em;display:flex;align-items:center;gap:8px;margin-right:2px;white-space:nowrap;border:0;background:none;cursor:pointer;padding:4px 6px;border-radius:6px;color:var(--ink)}
.brand:hover{background:var(--soft)}
.brand svg{width:22px;height:22px;color:var(--accent)}
.grp{display:flex;align-items:center;gap:4px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--raise);padding:6px 11px;border-radius:6px;cursor:pointer;white-space:nowrap;line-height:1.2;min-height:28px;transition:background-color .15s var(--ease),border-color .15s var(--ease),color .15s var(--ease),box-shadow .15s var(--ease)}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn.pri:disabled{opacity:1;background:var(--line);color:var(--muted);filter:none}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 35%,transparent)}
.btn:active:not(:disabled){transform:translateY(.5px)}
.btn.alt{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.sm{padding:4px 8px;font-size:12px}
.btn.danger{color:var(--bad)}
.ib{width:30px;height:30px;padding:0;display:inline-grid;place-items:center}
.ib svg{width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;padding:2px;background:var(--bg);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:5px 10px;border-radius:5px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button:hover:not(.on){color:var(--ink);background:color-mix(in srgb,var(--raise) 55%,transparent)}
.seg button.on{background:var(--raise);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.14);font-weight:500}
.seg.full{display:flex;flex-wrap:nowrap}.seg.full button{flex:1 1 0;min-width:0;white-space:normal;line-height:1.2;padding:6px 6px}
.zl{font:12px var(--f-mono);min-width:44px;text-align:center;color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pb{width:150px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.pb i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.banner{display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap}
.banner b{font-weight:600}

.main{flex:1;display:grid;grid-template-columns:330px minmax(0,1fr) 290px;min-height:0}
.left,.right{background:var(--panel);min-height:0;overflow:auto}
.left{border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.right{border-left:1px solid var(--line)}
.tabs{display:flex;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{flex:1;border:0;background:transparent;padding:8px 2px 7px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;font-weight:500;font-size:11.5px;display:grid;justify-items:center;gap:3px}
.tabs button svg{width:19px;height:19px}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.lbody{overflow:auto;flex:1;min-height:0}
.sec{padding:14px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.sec h3{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec p{margin:0;color:var(--muted);font-size:12px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.ctl{display:grid;gap:3px}
.ctl-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ctl-h span:first-child{color:var(--ink)}
.u{display:flex;align-items:center;gap:3px;color:var(--muted);font-size:11px}
.u i{font-style:normal;font-family:var(--f-mono)}
.num,.inp,select,textarea{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.num{width:62px;font:12px var(--f-mono);text-align:right;padding:2px 5px}
.inp{width:100%}
select{width:100%;padding:5px 6px}
textarea{width:100%;resize:vertical;min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent);margin:2px 0}
input[type=color]{width:34px;height:26px;padding:0 2px;border:1px solid var(--line);border-radius:5px;background:var(--raise);cursor:pointer}
input[type=checkbox]{accent-color:var(--accent)}
.lbl{display:grid;gap:3px}
.lbl>span{font-size:12px}
.chk{display:flex;align-items:center;gap:7px;cursor:pointer}
.clr{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sw{display:flex;gap:5px;flex-wrap:wrap}
.sw button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);cursor:pointer;padding:0}

.lgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.lth{background:var(--raise);border:1px solid var(--line);border-radius:6px;padding:6px 4px 4px;cursor:pointer;display:grid;gap:3px;justify-items:center;font-size:10px;color:var(--muted);text-align:center;line-height:1.15}
.lth:hover{border-color:var(--accent);color:var(--ink)}
.lth.on{border-color:var(--accent);color:var(--ink);background:var(--soft)}
.lth canvas{display:block}

.drop{border:1.5px dashed var(--line);border-radius:8px;padding:14px 10px;text-align:center;color:var(--muted);cursor:pointer;background:var(--raise)}
.drop:hover,.drop.over{border-color:var(--accent);color:var(--ink)}
.drop b{color:var(--ink);font-weight:600}
.stats{display:flex;gap:12px;flex-wrap:wrap;font:12px var(--f-mono);color:var(--muted)}
.stats b{color:var(--ink);font-weight:500}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.ti{position:relative;aspect-ratio:1;border-radius:5px;overflow:hidden;background:var(--bg);cursor:grab;border:1px solid var(--line);max-width:100%}
.ti img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.ti .nm{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:var(--muted);padding:3px;text-align:center;word-break:break-all}
.ti.sel{outline:2px solid var(--accent);outline-offset:-2px}
.ti.ex img{filter:grayscale(1);opacity:.4}
.ti .cnt{position:absolute;left:3px;bottom:3px;background:var(--accent);color:var(--accent-ink);font:10px var(--f-mono);padding:0 4px;border-radius:7px;border:0;cursor:pointer}
.ti .tag{position:absolute;left:3px;top:3px;background:rgba(0,0,0,.6);color:#fff;font-size:8px;padding:1px 3px;border-radius:3px;letter-spacing:.04em}
.ti .hb{position:absolute;top:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;cursor:pointer;font-size:12px;line-height:24px;padding:0;opacity:0;transition:opacity .15s}
.ti .hb.fv{right:3px}.ti .hb.xb{right:30px}
.ti .hb.fv.on{opacity:1;background:var(--accent);color:var(--accent-ink)}
.ti:hover .hb,.ti:focus-within .hb{opacity:1}
.trayact{position:sticky;top:0;z-index:2;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:7px;display:grid;gap:6px}
.simg{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px}
.simg button{position:relative;flex:none;width:52px;height:52px;padding:0;border:2px solid var(--ok);border-radius:5px;overflow:hidden;cursor:pointer;background:var(--bg)}
.simg button.out{border-color:var(--line)}
.simg button.out img{filter:grayscale(1);opacity:.4}
.simg img{width:100%;height:100%;object-fit:cover;display:block}
.simg button span{position:absolute;right:1px;bottom:1px;font:9px var(--f-mono);background:rgba(0,0,0,.6);color:#fff;padding:0 3px;border-radius:3px}

.looks{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:6px}
.look{display:grid;gap:4px;justify-items:center;border:1px solid var(--line);background:var(--raise);border-radius:6px;padding:6px 4px;cursor:pointer;font-size:11px;color:var(--muted)}
.look:hover{border-color:var(--accent);color:var(--ink)}
.look i{display:block;width:56px;height:38px;border-radius:2px;border:1px solid var(--line)}
.chl{display:grid;gap:4px}
.chr{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:6px;align-items:center}
.chr.off .inp{opacity:.5;text-decoration:line-through}
.chr .inp{padding:3px 6px}
.chr .mv{display:flex;gap:0}
.chr .mv button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:10px;line-height:1;padding:0;width:24px;height:24px;border-radius:4px}
.chr .mv button:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.chr .mv button:disabled{opacity:.25;cursor:default}
.chr .n{border:1px solid var(--line);background:var(--raise);border-radius:9px;font:11px var(--f-mono);color:var(--muted);padding:1px 7px;cursor:pointer;min-width:34px}
.chr .n.on{border-color:var(--accent);color:var(--accent)}
.tlist{display:grid;gap:4px}
.tlist button{text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:5px;padding:6px 8px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlist button.on{border-color:var(--accent);background:var(--soft)}

.stagewrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.pbar{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.pbar .ttl{font-family:var(--f-ui);font-weight:600;font-size:14px;min-width:170px;text-align:center;line-height:1.15}
.pbar .ttl small{display:block;font:11px var(--f-mono);color:var(--muted);font-weight:400}
.stage{flex:1;overflow:auto;display:grid;background:var(--stage);min-height:0;
  background-image:radial-gradient(color-mix(in srgb,var(--muted) 22%,transparent) 1px,transparent 1px);background-size:16px 16px}
#cv{margin:auto;display:block;touch-action:none}
.hint{padding:6px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);background:var(--panel);display:flex;gap:14px;flex-wrap:wrap;justify-content:space-between}
.hint .dim{font-family:var(--f-mono)}
.strip{display:flex;gap:10px;overflow-x:auto;padding:10px 12px 8px;background:var(--panel);border-top:1px solid var(--line);flex:none;align-items:flex-end;min-height:96px}
.sth{flex:none;display:grid;gap:4px;justify-items:center;cursor:pointer;border:0;background:none;padding:3px;border-radius:6px;color:var(--muted)}
.sth canvas{display:block;box-shadow:0 1px 3px rgba(0,0,0,.25);outline:2px solid transparent;outline-offset:2px}
.sth.on canvas{outline-color:var(--accent)}
.sth.over canvas{outline:2px dashed var(--accent)}
.sth span{font:11px var(--f-mono)}
.sth.on span{color:var(--ink)}
.sadd{flex:none;align-self:center;border:1.5px dashed var(--line);background:transparent;border-radius:6px;color:var(--muted);padding:14px 12px;cursor:pointer}
.sadd:hover{border-color:var(--accent);color:var(--ink)}

.ph-head{display:flex;gap:10px;align-items:center}
.ph-head img{width:52px;height:52px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.ph-head .nm{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:170px}
.badge{display:inline-block;font:11px var(--f-mono);padding:1px 6px;border-radius:9px;border:1px solid currentColor;justify-self:start}
.badge.ok{color:var(--ok)}.badge.warn{color:var(--warn)}.badge.bad{color:var(--bad)}
.empty{padding:22px 16px;color:var(--muted);display:grid;gap:12px}
.empty h4{margin:0;color:var(--ink);font-family:var(--f-brand);font-size:16px;font-weight:600}
.keys{display:grid;grid-template-columns:auto 1fr;gap:5px 10px;font-size:12px}
kbd{justify-self:start;align-self:start;font:11px var(--f-mono);background:var(--raise);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;white-space:nowrap}

dialog{border:1px solid var(--line);border-radius:12px;padding:0;background:var(--panel);color:var(--ink);width:min(500px,calc(100vw - 32px));box-shadow:0 20px 60px rgba(0,0,0,.35);max-height:calc(100vh - 32px)}
dialog::backdrop{background:rgba(10,12,16,.45)}
.dlg-h{padding:16px 18px 4px;font-family:var(--f-brand);font-size:19px;font-weight:700}
.dlg-s{padding:0 18px;color:var(--muted);font-size:12px}
.dlg-b{padding:10px 18px 14px;display:grid;gap:12px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;align-items:center;flex-wrap:wrap}
.dlg-f .grow{flex:1;color:var(--muted);font-size:12px}
.summary{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:grid;gap:4px;font-size:12px}
.summary .k{color:var(--muted)}
.summary .v{font-family:var(--f-mono);text-align:right}
.srow{display:flex;justify-content:space-between;gap:10px;align-items:center}
.warnl{display:grid;gap:5px;font-size:12px}
.warnl div{display:flex;gap:8px;align-items:baseline}
.warnl .w{color:var(--warn)}.warnl .e{color:var(--bad)}.warnl .o{color:var(--ok)}
.eres{display:grid;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.eres b{font-weight:600}
.eres .srow span{font:12px var(--f-mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.linkb{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;text-decoration:underline}
.est{font:12px var(--f-mono);background:var(--soft);border-radius:7px;padding:9px 11px;color:var(--ink)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 10px 9px 16px;border-radius:9px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);z-index:var(--z-toast);max-width:min(640px,calc(100vw - 32px));display:flex;align-items:center;gap:12px;animation:toastIn .2s var(--ease)}
.toast:not(:has(button)){padding-right:16px}
.toast button{flex:none;border:0;background:color-mix(in srgb,var(--bg) 16%,transparent);color:var(--bg);font-weight:600;padding:5px 11px;border-radius:6px;cursor:pointer;min-height:28px}
.toast button:hover{background:color-mix(in srgb,var(--bg) 28%,transparent)}
.toast button:focus-visible{outline-color:var(--bg)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,6px)}to{opacity:1;transform:translate(-50%,0)}}

.btn.on{background:var(--soft);border-color:var(--accent);color:var(--accent)}
.main.noL .left,.main.noR .right{display:none}
.main.noL{grid-template-columns:minmax(0,1fr) 290px}
.main.noR{grid-template-columns:330px minmax(0,1fr)}
.main.noL.noR{grid-template-columns:minmax(0,1fr)}
.main.noS .strip,.main.noS .hint{display:none}
@media (max-width:1150px){.main{grid-template-columns:280px minmax(0,1fr) 250px}}
@media (max-width:900px){
  body{overflow:auto;height:auto}
  .main{display:flex;flex-direction:column}
  .left{overflow:visible;border-right:0;border-bottom:1px solid var(--line)}
  .lbody{max-height:50vh}
  .stagewrap{order:-1}
  .stage{height:56vh;flex:none}
  .right{border-left:0;overflow:visible}
  .top{position:sticky;top:0;z-index:var(--z-top)}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* ===== aggiunte Fotolibro Studio ===== */
.top{gap:8px}
.job{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:600;width:190px;min-width:120px}
.job:hover{border-color:var(--line)}.job:focus{border-color:var(--accent);background:var(--raise);outline:0}
.btn.nav{font-size:12px;padding:5px 10px}
.btn.big{padding:12px 22px;font-size:15px;border-radius:9px}
.pbar .ttl{min-width:200px}
.sth.fixed span{font-weight:600;color:var(--ink)}
.sth.fixed canvas{box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 1px var(--line)}

/* temi */
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.thc{display:grid;gap:6px;justify-items:center;border:1.5px solid var(--line);background:var(--raise);border-radius:10px;padding:8px 6px 7px;cursor:pointer;color:var(--ink);font-size:12px;transition:border-color .15s,transform .15s}
.thc:hover{border-color:var(--muted);transform:translateY(-1px)}
.thc.on{border-color:var(--accent);background:var(--soft);box-shadow:0 0 0 2px var(--soft)}
.thc b{font-weight:600}
.thp{line-height:0;box-shadow:0 2px 8px rgba(0,0,0,.22);border-radius:2px;overflow:hidden}
.covl{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.cl{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:6px 8px;cursor:pointer;font-size:12px;text-align:left;color:var(--ink)}
.cl:hover{border-color:var(--muted)}.cl.on{border-color:var(--accent);background:var(--soft)}
.looks i{position:relative;display:flex;gap:var(--g);padding:var(--m);background:#fff;width:60px;height:40px;border-radius:2px;border:1px solid var(--line)}
.looks i u{flex:1;background:#b9c0c8;border-radius:var(--r)}
.sw button.on{outline:2px solid var(--accent);outline-offset:1px}

/* decorazioni */
.motifs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.mt{display:grid;justify-items:center;gap:2px;border:1px solid var(--line);background:var(--raise);border-radius:7px;padding:6px 2px 4px;cursor:grab;font-size:9.5px;color:var(--muted);line-height:1.1;text-align:center}
.mt:hover{border-color:var(--accent);color:var(--ink)}
.tadd{display:grid;grid-template-columns:repeat(2,1fr);gap:6px}
.tadd .btn{justify-content:center}

/* esportazione */
dialog.wide{width:min(680px,calc(100vw - 32px))}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px}
.etabs button{padding:7px 14px;font:500 13px var(--f-ui)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opts:has(>:nth-child(3)){grid-template-columns:1fr 1fr 1fr}
.opt{display:flex;gap:9px;align-items:flex-start;border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;cursor:pointer;background:var(--raise)}
.opt.on{border-color:var(--accent);background:var(--soft)}
.opt input{margin-top:2px}
.opt span{display:grid;gap:3px}.opt b{font-weight:600}.opt small{color:var(--muted);font-size:11.5px;line-height:1.3}
.dlg-b .dlg-s{padding:0}
dialog.full{width:calc(100vw - 40px);height:calc(100vh - 40px);max-width:none;max-height:none;display:flex;flex-direction:column;background:#2a2d33;border:0}
dialog.full:not([open]){display:none}
.flipbar{display:flex;align-items:center;gap:12px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.flipbar span{color:var(--muted);font-size:12px;flex:1}
#flipFrame{flex:1;border:0;width:100%;background:#2a2d33}

/* schermata iniziale */
.start{position:fixed;inset:0;z-index:var(--z-start);background:var(--bg);overflow:auto;
  background-image:radial-gradient(color-mix(in srgb,var(--muted) 16%,transparent) 1px,transparent 1px);background-size:18px 18px}
.startin{max-width:1360px;margin:0 auto;padding:26px 28px 30px;display:grid;gap:18px}
.shead{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.shead p{margin:0;color:var(--muted);font-size:14px}
.brand.big{font-size:28px;cursor:default}.brand.big svg{width:30px;height:30px;color:var(--accent)}
.sgrid{display:grid;grid-template-columns:minmax(260px,1fr) minmax(0,2.1fr) minmax(270px,1fr);gap:16px;align-items:start}
.scol{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.scol h2{margin:0;font:700 19px var(--f-brand);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.scol h2 i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px}
.scol h2 small{font:400 12px var(--f-ui);color:var(--muted);flex-basis:100%;padding-left:36px}
.sdrop{border:2px dashed var(--line);border-radius:12px;padding:26px 14px;display:grid;gap:6px;justify-items:center;text-align:center;cursor:pointer;background:var(--raise);color:var(--muted)}
.sdrop:hover,.sdrop.over{border-color:var(--accent);color:var(--ink);background:var(--soft)}
.sdrop b{color:var(--ink);font-size:15px}
.sdi svg{width:42px;height:42px;color:var(--accent)}
.smos{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;position:relative}
.smos img,.smos i{width:100%;aspect-ratio:1;object-fit:cover;border-radius:4px;background:var(--line);display:block}
.smos span{position:absolute;right:4px;bottom:4px;background:rgba(0,0,0,.65);color:#fff;font:11px var(--f-mono);padding:1px 6px;border-radius:8px}
.sinfo{font-size:12.5px;color:var(--muted)}.sinfo b{color:var(--ink)}
.sthemes{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.sgo{display:grid;gap:8px;justify-items:stretch;margin-top:4px}
.sgo .linkb{justify-self:center;font-size:12.5px}
.sfoot{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.sfoot>span{margin-right:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:1100px){.sgrid{grid-template-columns:1fr 1fr}.scol.wide{grid-column:1/-1;order:3}}
.top{flex-wrap:nowrap;overflow:hidden}
@media (max-width:1660px){.top .brand span{display:none}#zOut,#zIn{display:none}}
@media (max-width:1440px){#tF,#zFit{display:none}.job{width:140px}.top .btn{padding:6px 9px}.top .seg button{padding:5px 8px}}
@media (max-width:1250px){#modeSeg,#bNew{display:none}}

/* pagine speciali */
.specials{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.spc{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--raise);border-radius:8px;padding:7px 8px;cursor:pointer;color:var(--ink)}
.spc canvas{grid-row:1/3}.spc b{font-size:12px;font-weight:600}.spc small{font-size:10.5px;color:var(--muted);line-height:1.2}
.spc:hover{border-color:var(--accent);background:var(--soft)}
details.more summary{cursor:pointer;color:var(--accent);font-size:12px;margin:4px 0 8px}
.warn{color:var(--warn)!important}
.tabs button{font-size:11px}

/* rifinitura UI/UX (linee guida ui-ux-pro-max: hover, focus, target ≥24px, stati) */
.brand{font-weight:700;letter-spacing:0}
.lth,.thc,.spc,.cl,.look,.mt,.opt,.sdrop,.drop,.tlist button{transition:border-color .15s var(--ease),background-color .15s var(--ease),color .15s var(--ease),transform .15s var(--ease)}
.spc:hover,.lth:hover{transform:translateY(-1px)}
.tabs button{transition:color .15s var(--ease),border-color .15s var(--ease)}
.tabs button:focus-visible,.seg button:focus-visible{outline-offset:-2px}
.chk input{width:16px;height:16px;flex:none}
.chk{min-height:24px}
.sth:focus-visible canvas{outline-color:var(--accent)}
.sdrop:focus-visible{outline-offset:3px}
.scol h2 i{font:600 13px var(--f-ui)}

/* schermata iniziale: suggerimenti, progresso, barra d'azione sempre visibile */
.startin{padding-bottom:0}
.shead .sacts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sres{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.sres span{margin-right:auto}
.sprog{display:grid;gap:6px;background:var(--soft);border-radius:10px;padding:10px 12px}
.sprog>span{font-weight:600}
.sprog .pb{width:100%;height:8px;border-radius:4px}
.sprog small{color:var(--muted);font-size:11.5px;line-height:1.35}
.snote{margin:0;color:var(--muted);font-size:12px}
.ssug{margin:0;background:var(--soft);border-radius:8px;padding:8px 11px;font-size:12.5px;color:var(--ink)}
.ssug b{color:var(--accent)}
.thc{position:relative}
.stag{position:absolute;top:-8px;right:-6px;font:600 10px var(--f-ui);font-style:normal;background:var(--accent);color:var(--accent-ink);padding:2px 7px;border-radius:9px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sbar{position:sticky;bottom:0;z-index:2;margin:0 -28px;padding:12px 28px calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.06)}
.ssum{flex:1;min-width:240px;font-size:13.5px;color:var(--muted)}.ssum b{color:var(--ink);font-weight:600}
.sbar .btn.big{min-width:250px}
.banner .warn{font-weight:500}
.banner>span{flex:1;min-width:280px}
body:has(#start:not([hidden])) .toast{bottom:auto;top:18px}

/* sticker illustrati */
.artg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.art{aspect-ratio:1;min-width:0;overflow:hidden;display:grid;place-items:center;padding:5px;border:1px solid var(--line);border-radius:8px;cursor:grab;
  background:color-mix(in srgb,var(--accent) 7%,var(--raise));transition:border-color .15s var(--ease),transform .15s var(--ease)}
.art img{width:100%;height:100%;max-width:100%;max-height:100%;min-width:0;min-height:0;object-fit:contain;pointer-events:none}
.art:hover{border-color:var(--accent);transform:translateY(-1px)}
.art.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
.right .ph-head img{background:transparent}

</style>

const pad3=n=>String(n).padStart(3,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
function el(tag,attrs={},...kids){
  const e=document.createElement(tag);
  for(const k in attrs){const v=attrs[k];
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='style')e.style.cssText=v;
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='value')e.value=v;
    else if(k==='checked')e.checked=!!v;
    else if(k==='html')e.innerHTML=v;
    else if(v===true)e.setAttribute(k,'');
    else e.setAttribute(k,v);}
  for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c));}
  return e;
}
let toastT=0;
/* toast: 3,5–5 s (linee guida), "Annulla" quando l'azione è annullabile, pausa al passaggio del mouse */
function toast(msg,ms=3500,act){const t=$('#toast');let undoable=act==='undo'||/Ctrl\+Z/.test(msg);
  if(undoable)msg=msg.replace(/[\s.(:·]*Ctrl\+Z per (annullare|tornare indietro)\)?\.?/,'').replace(/\s*\(\s*\)$/,'');
  t.replaceChildren(el('span',{},msg));
  if(undoable&&typeof undo==='function')t.append(el('button',{type:'button',onclick:()=>{t.hidden=true;undo();}},'Annulla'));
  t.hidden=false;clearTimeout(toastT);const wait=Math.max(ms,undoable?6000:0);
  const arm=d=>{clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,d);};arm(wait);
  t.onmouseenter=()=>clearTimeout(toastT);t.onmouseleave=()=>arm(2000);}

const TAU=Math.PI*2;

const MOTIF_IDS=Object.keys(MOTIFS);
function drawMotif(ctx,id,x,y,size,rot,c,c2,op=1,flip=false){
  const m=MOTIFS[id];if(!m)return;
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot*Math.PI/180);ctx.scale(flip?-size:size,size);ctx.globalAlpha*=op;
  try{m.d(ctx,c,c2);}catch(e){}
  ctx.restore();
}

/* ============ motivi di sfondo (pattern) ============ */
const PATTERNS={
  none:{l:'Nessuno'},
  scatter:{l:'Sparsi'},
  grid:{l:'A griglia'},
  dots:{l:'Pois'},
  stripes:{l:'Righe'},
  diag:{l:'Righe diagonali'},
  plaid:{l:'Scozzese'},
  frame:{l:'Cornice di motivi'},
};
/* disegna un pattern sul rettangolo (mm) già scalato: s = px per mm */
function drawPattern(ctx,P,box,s,seed){

  const R=rng(seed||1),cols=P.colors&&P.colors.length?P.colors:['#000'],mot=P.motifs&&P.motifs.length?P.motifs:['dot'];
  const size=(P.size||10)*s,gap=(P.gap||(P.size||10)*2.2)*s,op=P.op==null?1:P.op;

    for(let k=0;k<2;k++){ctx.save();if(k){ctx.translate(X,Y);ctx.rotate(Math.PI/2);ctx.translate(-X,-Y-W);}
      const L=k?W:H,Wd=k?H:W;
      for(let x=0;x<Wd+g;x+=g){ctx.globalAlpha=op*.55;ctx.fillStyle=c[0];ctx.fillRect((k?X:X)+x,(k?Y:Y),g*.34,L*2+g);
        ctx.globalAlpha=op*.5;ctx.fillStyle=c[1%c.length];ctx.fillRect(X+x+g*.5,Y,g*.06,L*2+g);ctx.fillRect(X+x+g*.62,Y,g*.06,L*2+g);}
      ctx.restore();}

    let row=0;for(let y=Y-gap;y<Y+H+gap;y+=gap*.866){const off=(row++%2)*gap/2;for(let x=X-gap+off;x<X+W+gap;x+=gap){

      const jx=(R()-.5)*gap*.8,jy=(R()-.5)*gap*.8,sc=.6+R()*.7,m=mot[Math.floor(R()*mot.length)],c=cols[Math.floor(R()*cols.length)];
      drawMotif(ctx,m,x+jx,y+jy,size*sc,P.rot===false?0:(R()*80-40),c,c2,op);k++;}}
  }
  ctx.restore();
}

function baseTheme(id){return THEMES.find(t=>t.id===id)||THEMES[0];}
/* tema effettivo = tema base + personalizzazioni del libro */
function resolveTheme(bt){
  bt=bt||BOOK.theme;const b=baseTheme(bt.id);
  const T={...b,colors:{...b.colors,...(bt.colors||{})},fonts:{...b.fonts,...(bt.fonts||{})}};
  T.deco=bt.deco==null?1:bt.deco;T.coverLayout=bt.coverLayout||b.coverLayout;T.coverBg=bt.coverBg||b.coverBg||'motivo';
  T.endPatternOn=bt.endPattern!==false;T.coverPatternOn=bt.coverPattern!==false;
  return T;
}
function bookYear(){const c=new Map();for(const e of LIB.values()){if(e.sample||e.date==null)continue;const y=new Date(e.date).getFullYear();c.set(y,(c.get(y)||0)+1);}
  let b=null,n=0;for(const[y,k] of c)if(k>n){b=y;n=k;}if(b)return b;for(const e of LIB.values())if(e.date!=null)return new Date(e.date).getFullYear();return new Date().getFullYear();}
function fillTpl(s,ctx={}){const y=ctx.year||bookYear();return String(s||'').replace(/\{anno\}/g,y);}
/* stile testi per ruolo */
function roleStyle(role,T,bg){
  const C=T.colors,ink=bg?(Math.abs(lum(bg)-lum(C.ink))<90?contrastInk(bg):C.ink):C.ink;
  const ttl=bg&&Math.abs(lum(bg)-lum(C.title))<70?contrastInk(bg):C.title;
  const base={font:T.fonts.title,italic:!!T.titleItalic,bold:!!T.titleBold,upper:!!T.titleUpper,ls:T.titleLs||0,shadow:false,boxOp:0,strokeW:0,op:100,lh:1.1};
  switch(role){
    case'cover-title':return{...base,color:bg&&Math.abs(lum(bg)-lum(C.coverInk))<80?C.title:C.coverInk};
    case'cover-sub':return{font:T.fonts.sub,italic:false,bold:false,upper:!!T.subUpper,ls:T.subUpper?24:4,color:bg&&Math.abs(lum(bg)-lum(C.coverInk))<80?C.ink:C.coverInk,shadow:false,op:90,lh:1.1};
    case'spine':return{font:T.fonts.sub,italic:false,bold:true,upper:true,ls:12,color:C.coverInk,shadow:false,op:100,lh:1};
    case'back':return{font:T.fonts.sub,italic:false,bold:false,upper:!!T.subUpper,ls:T.subUpper?18:2,color:C.coverInk,shadow:false,op:80,lh:1.2};
    case'chapter':return{...base,color:ttl};
    case'chapter-sub':return{font:T.fonts.sub,italic:false,bold:false,upper:true,ls:18,color:ink,shadow:false,op:75,lh:1.1};
    case'band':return{...base,color:ttl};
    case'overlay':return{...base,color:'#ffffff',shadow:true};
    case'dedica':return{...base,color:ttl,lh:1.25};
    case'caption':return{font:T.fonts.sub,italic:false,bold:false,upper:false,ls:2,color:ink,shadow:false,op:90,lh:1.2};
    case'end':return{...base,color:C.endInk};
    case'quote':return{...base,color:ttl,lh:1.25,italic:base.italic||!/Vibes|Script|Pacifico|Caveat|Amatic|Bebas/.test(T.fonts.title)};
    case'quote-author':return{font:T.fonts.sub,italic:false,bold:false,upper:true,ls:16,color:ink,shadow:false,op:70,lh:1.1};
  }
  return{color:ink};
}

  if(e.prevBlob&&!e.loading){e.loading=true;createImageBitmap(e.prevBlob).then(b=>{PREV.set(e.id,b);
    while(PREV.size>PREV_MAX){const k=PREV.keys().next().value;closeSrc(PREV.get(k));PREV.delete(k);}draw();}).catch(()=>{}).finally(()=>e.loading=false);}

}

function folderOf(f){const rp=f._path||f.webkitRelativePath||'';const i=rp.lastIndexOf('/');return i>0?rp.slice(0,i):'';}
/* trascinamento di cartelle intere, anche annidate */
function filesFromDT(dt){
  const items=[...(dt.items||[])].filter(i=>i.kind==='file');
  const entries=items.map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null);
  if(!entries.some(e=>e&&e.isDirectory))return Promise.resolve([...dt.files]);
  const out=[];
  const walk=async(en,path)=>{
    if(en.isFile){try{const f=await new Promise((res,rej)=>en.file(res,rej));f._path=path+f.name;out.push(f);}catch(e){}}
    else if(en.isDirectory){const r=en.createReader();let batch;do{batch=await new Promise((res,rej)=>r.readEntries(res,rej));for(const c of batch)await walk(c,path+en.name+'/');}while(batch.length);}};
  return(async()=>{progress('Leggo le cartelle…',0,0);for(const en of entries)if(en)await walk(en,'');progress(null);return out;})();
}

async function importFiles(files){
  const arr=[...files].filter(isImgFile);const nonImg=files.length-arr.length;
  if(!arr.length){if(nonImg)toast('Nessuna immagine tra i file scelti.');return[];}
  const byKey=new Map(),byKey2=new Map(),byName=new Map();
  for(const e of LIB.values()){if(e.sample)continue;byKey.set(e.name+'|'+e.size+'|'+(e.folder||''),e);
    if(!e.file){byKey2.set(e.name+'|'+e.size,e);byName.set(e.name,byName.has(e.name)?null:e);}}
  const todo=[];let dup=0,relinked=0;
  for(const f of arr){let ex=byKey.get(f.name+'|'+f.size+'|'+folderOf(f));
    if(!ex){const c=byKey2.get(f.name+'|'+f.size)||byName.get(f.name);if(c&&!c.file)ex=c;}
    if(ex){if(ex.file){dup++;continue;}byKey2.delete(ex.name+'|'+ex.size);byName.delete(ex.name);
      if(ex.prevBlob){ex.file=f;ex.size=f.size;relinked++;continue;}todo.push([f,ex]);}
    else todo.push([f,null]);}
  const out=[];let bad=0,done=0,idx=0;
  if(todo.length){
    progress(`Importo 0 / ${todo.length}`,0,todo.length);
    const worker=async()=>{while(idx<todo.length){const[f,keep]=todo[idx++];
      try{out.push(await ingest(f,keep));}catch(err){bad++;}
      done++;progress(`Importo ${done} / ${todo.length}`,done,todo.length);
      if(done%12===0){sortOrder();if(START.open)renderStartLive();else renderLeft();}}};
    await Promise.all([worker(),worker(),worker()]);
    progress(null);
  }
  if(out.some(e=>!e.sample))removeSamples();
  sortOrder();SIMS=findSimilar();syncChapters();
  const nf0=new Set(out.map(e=>e.folder||'')),msg0=nf0.size>1?`${nf0.size} cartelle → ${nf0.size} capitoli`:'';
  const msg=[];if(out.length)msg.push(`${out.length} foto importate`);if(relinked)msg.push(`${relinked} ricollegate agli originali`);
  if(msg0)msg.push(msg0);if(dup)msg.push(`${dup} già presenti`);if(bad)msg.push(`${bad} non lette (usa JPG, PNG o WebP; le HEIC dell'iPhone vanno convertite)`);
  if(msg.length)toast(msg.join(' · '),4500);
  updateBanner();
  return out.map(e=>e.id);
}

function findSimilar(){
  const ids=[...LIB.values()].filter(e=>e.hash).sort((a,b)=>((a.date??0)-(b.date??0))||a.name.localeCompare(b.name)).map(e=>e.id);
  const par=new Map(ids.map(i=>[i,i]));const f=x=>{while(par.get(x)!==x){par.set(x,par.get(par.get(x)));x=par.get(x);}return x;};
  const uni=(a,b)=>{a=f(a);b=f(b);if(a!==b)par.set(b,a);};
  for(let i=0;i<ids.length;i++){const a=LIB.get(ids[i]);
    for(let j=i+1;j<Math.min(ids.length,i+14);j++){const b=LIB.get(ids[j]);
      const dt=(a.date!=null&&b.date!=null)?Math.abs(a.date-b.date):null;const ex=a.dateSrc==='exif'&&b.dateSrc==='exif';
      if(ex&&dt>120000)break;
      const hd=ham(a.hash,b.hash),arA=a.w/a.h,arB=b.w/b.h;if(Math.abs(Math.log(arA/arB))>.12)continue;
      if(hd<=3||(hd<=11&&ex&&dt<=120000)||(hd<=5&&!ex&&dt!=null&&dt<=600000))uni(a.id,b.id);}}
  const byHash=new Map();for(const id of ids){const h=LIB.get(id).hash;if(byHash.has(h))uni(byHash.get(h),id);else byHash.set(h,id);}
  const g=new Map();for(const id of ids){const r=f(id);if(!g.has(r))g.set(r,[]);g.get(r).push(id);}
  return[...g.values()].filter(x=>x.length>1);
}

function gridDims(m,asp){let c=Math.max(1,Math.round(Math.sqrt(m*asp)));c=Math.min(c,m);let r=Math.ceil(m/c);while(r>1&&(r-1)*c>=m)r--;return[c,r];}
function subGrid(m,x,y,w,h,asp,centered){
  const[c,r]=gridDims(m,asp),a=[];
  for(let i=0;i<r;i++){const k=i<r-1?c:m-(r-1)*c;
    for(let j=0;j<k;j++){if(centered)a.push([x+(j+(c-k)/2)*w/c,y+i*h/r,w/c,h/r]);else a.push([x+j*w/k,y+i*h/r,w/k,h/r]);}}
  return a;
}
function genJustified(n,rs,A){
  const total=rs.reduce((a,b)=>a+b,0);let best=null;
  for(let k=1;k<=n;k++){
    const rows=[];let cur=[],cum=0;
    for(let i=0;i<n;i++){cur.push(i);cum+=rs[i];
      const left=k-rows.length-1;if(left<=0)continue;
      if(n-i-1===left||cum>=total*(rows.length+1)/k-rs[i]/2){rows.push(cur);cur=[];}}
    if(cur.length)rows.push(cur);if(rows.length!==k)continue;
    const Rs=rows.map(r=>r.reduce((a,i)=>a+rs[i],0)),E=Rs.reduce((a,R)=>a+A/R,0);
    const err=Math.abs(Math.log(E))+rows.reduce((a,r,j)=>a+Math.abs(Math.log(Rs[j]/(total/k)))*.15,0);
    if(!best||err<best.err)best={err,rows,Rs,E};
    if(E>3)break;
  }
  if(!best)return null;
  const out=[];let y=0;
  best.rows.forEach((r,j)=>{const h=(A/best.Rs[j])/best.E;let x=0;for(const i of r){const w=rs[i]/best.Rs[j];out[i]=[x,y,w,h];x+=w;}y+=h;});
  return out;
}
function genColumns(n,rs,A){
  let best=null;
  for(let c=1;c<=Math.min(n,8);c++){
    const cols=Array.from({length:c},()=>({items:[],H:0}));
    for(let i=0;i<n;i++){const col=cols.reduce((a,b)=>b.H<a.H?b:a);col.items.push(i);col.H+=1/rs[i];}
    const err=cols.reduce((a,col)=>a+Math.abs(Math.log(A/c*col.H)),0)/c;
    if(!best||err<best.err)best={err,cols,c};
  }
  const out=[];best.cols.forEach((col,j)=>{let y=0;for(const i of col.items){const h=(1/rs[i])/col.H;out[i]=[j/best.c,y,1/best.c,h];y+=h;}});
  return out;
}
function genCenter(n,A){
  if(n<3)return null;
  const m=n-1,land=A>=1,out=[];
  if(m<=8){const a=Math.ceil(m/2),b=m-a,s=m<=2?.27:.22;
    if(land){out.push(b?[s,0,1-2*s,1]:[s,0,1-s,1]);for(let i=0;i<a;i++)out.push([0,i/a,s,1/a]);for(let i=0;i<b;i++)out.push([1-s,i/b,s,1/b]);}
    else{out.push(b?[0,s,1,1-2*s]:[0,s,1,1-s]);for(let i=0;i<a;i++)out.push([i/a,0,1/a,s]);for(let i=0;i<b;i++)out.push([i/b,1-s,1/b,s]);}
    return out;}
  return null;
}
function genHero(n,A){
  if(n<3)return null;const f=clamp(1.5/Math.sqrt(n),.3,.72);
  if(A>=1)return[[0,0,f,1],...subGrid(n-1,f,0,1-f,1,(1-f)*A)];
  return[[0,0,1,f],...subGrid(n-1,0,f,1,1-f,A/(1-f))];
}
const GENS=[
  ['justified','Righe su misura',(n,rs,A)=>genJustified(n,rs,A),true],
  ['columns','Colonne',(n,rs,A)=>genColumns(n,rs,A),true],
  ['grid','Griglia',(n,rs,A)=>subGrid(n,0,0,1,1,A,false),false],
  ['centered','Griglia centrata',(n,rs,A)=>subGrid(n,0,0,1,1,A,true),false],
  ['hero','Una in evidenza',(n,rs,A)=>genHero(n,A),false],
  ['center','Una al centro',(n,rs,A)=>genCenter(n,A),false],

function candidates(n,rs,A){
  const out=[],seen=new Set();if(n<1)return out;
  const push=(key,name,defs,ordered)=>{if(!defs||defs.length!==n||defs.some(d=>!d))return;
    const sig=defs.map(d=>d.map(v=>v.toFixed(3)).join(',')).sort().join(';');if(seen.has(sig))return;seen.add(sig);out.push({key,name,defs,ordered});};
  for(const[name,defs] of TEMPLATES)if(defs.length===n)push('t:'+name,name,defs,false);
  for(const[k,name,f,ord] of GENS)push('g:'+k,name,f(n,rs,A),ord);
  return out;
}
function bestPerm(n,cost){
  if(n<=7){let best=null,bc=Infinity;const used=new Array(n).fill(false),perm=new Array(n);
    const rec=(ci,acc)=>{if(acc>=bc)return;if(ci===n){bc=acc;best=perm.slice();return;}
      for(let ii=0;ii<n;ii++){if(used[ii])continue;used[ii]=true;perm[ci]=ii;rec(ci+1,acc+cost(ci,ii));used[ii]=false;}};
    rec(0,0);return{perm:best,cost:bc};}
  const used=new Set(),perm=new Array(n);let tot=0;
  for(let ci=0;ci<n;ci++){let bi=-1,bv=Infinity;for(let ii=0;ii<n;ii++){if(used.has(ii))continue;const v=cost(ci,ii);if(v<bv){bv=v;bi=ii;}}used.add(bi);perm[ci]=bi;tot+=bv;}
  return{perm,cost:tot};
}
function scoreCand(cand,items,A){
  const n=items.length,cells=cand.defs.map(d=>({ar:(d[2]/d[3])*A,area:d[2]*d[3]}));
  const maxA=Math.max(...cells.map(c=>c.area)),minA=Math.min(...cells.map(c=>c.area));
  const cost=(ci,ii)=>{const it=items[ii];let v=it.ar?Math.abs(Math.log(cells[ci].ar/it.ar)):.25;if(it.fav)v+=1.5*(1-cells[ci].area/maxA);return v+.012*Math.abs(ci-ii);};
  let r;if(cand.ordered){let t=0;for(let i=0;i<n;i++)t+=cost(i,i);r={perm:[...Array(n).keys()],cost:t};}else r=bestPerm(n,cost);
  const pen=(minA<.035?.35:0)+(cand.key==='t:Passe-partout'?.18:0);
  return{perm:r.perm,score:r.cost/n+pen};

function pagePhs(sp,side){return sp.cells.filter(c=>c.side===side).map(c=>c.ph);}
function pageCands(sp,side,phs){
  phs=phs||pagePhs(sp,side);const I=areaOf(sp,side),A=I.w/I.h;

const shapeSig=defs=>defs?defs.map(d=>d.map(v=>v.toFixed(1)).join(',')).sort().join(';'):'';

  if(sp.mode==='spread'){setSpreadMode(sp,'pages');side='L';}
  const pos=pageNum(i,side);let msg='';
  if(where==='replace'){
    const needPh=['quote-photo','photo-quote','scrap'].includes(kind),old=clearSide(sp,side);
    const left=buildSpecial(sp,side,kind,{...o,phs:needPh?old:[]}),back=(needPh?left:old).filter(ph=>!usedInInterior(ph.img,sp,side));

    msg=left.length?` · ${left.length} foto spostate accanto`:'';

/* riempie una pagina vuota prendendo qualche foto dalle pagine vicine più piene (senza svuotarle) */
function balanceInto(sp,side,want=3){

    .filter(x=>x.n>=4).sort((a,b)=>Math.abs(a.sl.pos-pos)-Math.abs(b.sl.pos-pos));

function effectIdx(){return BOOK.spreads.findIndex(sp=>isInner(sp)&&(meta(sp,'L').special==='effect'||meta(sp,'R').special==='effect'));}
function makeEffectSpread(p1,p2){

  const old=effectIdx();if(old>=0)BOOK.spreads.splice(old,1);

  if(shape==='heart'){heartPath(ctx,X,Y,W,H);return;}

function filterStr(p){
  const f=[];if(p.br!==100)f.push(`brightness(${p.br}%)`);if(p.ct!==100)f.push(`contrast(${p.ct}%)`);if(p.sat!==100)f.push(`saturate(${p.sat}%)`);
  if(p.gray)f.push(`grayscale(${p.gray}%)`);if(p.sepia)f.push(`sepia(${p.sepia}%)`);return f.length?f.join(' '):'none';
}

/* box filter con immagine integrale */

/* analizza una foto: trova il soggetto, valuta se è adatta, prepara la maschera ad alta qualità */
async function fxAnalyze(e){

    const g=document.createElement('canvas');g.width=W;g.height=H;const gx=g.getContext('2d',{willReadFrequently:true});gx.drawImage(src,0,0,W,H);

const HIST={past:[],future:[]};
function snap(){return JSON.stringify(BOOK);}
function commit(){const s=snap();if(HIST.past[HIST.past.length-1]===s){scheduleStrip();return;}HIST.past.push(s);if(HIST.past.length>80)HIST.past.shift();HIST.future=[];updUndo();scheduleStrip();scheduleSave();}
function resetHistory(){HIST.past=[snap()];HIST.future=[];updUndo();}
function restore(s){BOOK=JSON.parse(s);UI.cur=clamp(UI.cur,0,BOOK.spreads.length-1);
  if(sel&&!(sel.type==='cell'?byId(sel.id):sel.type==='deco'?decoById(sel.id):txtById(sel.id)))sel=null;syncAll();scheduleSave();}
function undo(){if(HIST.past.length<2)return;HIST.future.push(HIST.past.pop());restore(HIST.past[HIST.past.length-1]);updUndo();}
function redo(){if(!HIST.future.length)return;const s=HIST.future.pop();HIST.past.push(s);restore(s);updUndo();}
function updUndo(){$('#bUndo').disabled=HIST.past.length<2;$('#bRedo').disabled=!HIST.future.length;}
function syncAll(){renderLeft();renderProps();renderPbar();scheduleStrip();draw();}

/* ============ suggerimenti automatici dalla cartella: tema, titolo, sottotitolo, stima pagine ============ */
const W_=s=>new RegExp('(?:^|[^\\p{L}\\p{N}])(?:'+s+')(?=$|[^\\p{L}\\p{N}])','iu');
/* l'ordine conta a parità di punteggio: dal più specifico al più generico */
const THEME_KEYS=[
  ['valentino',W_("san ?valentino|valentine'?s?|innamorati")],
  ['papa',W_("festa del pap[aà]|pap[aà]|father'?s ?day")],
  ['mamma',W_("festa della mamma|mamma|mother'?s ?day")],
  ['matrimonio',W_('matrimonio|nozze|sposi|sposa|wedding|anniversario di matrimonio')],
  ['laurea',W_('laurea|graduation|proclamazione|diploma')],
  ['bimba',W_('nata|benvenuta|bimba|neonata|battesimo di \\p{L}+a')],
  ['bimbo',W_('nascita|battesimo|neonato|nato|benvenuto|bimbo|baby|primo anno')],
  ['compleanno',W_('compleanno|birthday|\\d+ ?anni|\\d+°|festa di compleanno')],
  ['pasqua',W_('pasqua|pasquetta|easter')],
  ['natale',W_('natale|natalizi[oae]?|christmas|xmas|vigilia|presepe|capodanno|befana')],
  ['estate',W_('estate|mare|spiaggia|vacanz[ae]|viaggio|viaggi|summer|holiday|ferie|crociera')],
  ['autunno',W_('autunno|autumn|vendemmia|castagne|halloween|foliage')],
  ['nordico',W_('inverno|neve|sci|settimana bianca|winter|snow')]
];
const GENERIC_DIR=/^(dcim|foto|photo|photos|pictures?|immagini|camera|camera roll|rullino|download|downloads|desktop|scrivania|documenti|documents|nuova cartella|new folder|export|esportate?|img|images|selezione|selezionate|stampa|\d{3}[a-z_]*|[a-z]?\d+|\d{4}[-_. ]?\d{2}([-_. ]?\d{2})?)$/i;
const MESI=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
function realPhotos(){return[...LIB.values()].filter(e=>!e.sample&&!e.excl);}
function cleanDir(s){return String(s||'').replace(/^\s*\d{1,3}\s*[_\-.)\s]\s*/,'').replace(/[_]+/g,' ').replace(/\s+-\s+|\s*-\s*$/g,' ').replace(/\s+/g,' ').trim();}
/* cartella comune a tutte le foto (la più profonda) */
function rootDirs(ph){
  const segs=ph.map(e=>(e.folder||'').split('/').filter(Boolean));if(!segs.length||segs.some(s=>!s.length))return segs[0]||[];
  const out=[];for(let i=0;;i++){const v=segs[0][i];if(v==null||segs.some(s=>s[i]!==v))break;out.push(v);}return out;}
function suggestTitle(){
  const ph=realPhotos();if(!ph.length)return null;
  const r=rootDirs(ph);for(let i=r.length-1;i>=0;i--){const c=cleanDir(r[i]);if(c&&!GENERIC_DIR.test(c)&&!GENERIC_DIR.test(r[i])&&c.length<=42&&/\p{L}{2}/u.test(c))return c[0].toUpperCase()+c.slice(1);}
  return null;
}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
function suggestTheme(){
  const ph=realPhotos();if(!ph.length)return null;
  const sc=new Map(),why=new Map(),root=rootDirs(ph).join('/');
  for(const [id,re] of THEME_KEYS){let s=0;
    if(re.test(root)){s+=ph.length*1.5;why.set(id,'cartella «'+cleanDir(root.split('/').filter(x=>re.test(x)).pop()||root)+'»');}
    let n=0,f=null;for(const e of ph){const p=(e.folder||'')+'/'+e.name;if(re.test(p)){n++;if(!f)f=(e.folder||'').split('/').filter(x=>re.test(x)).pop();}}
    s+=n;if(n&&!why.has(id))why.set(id,'cartella «'+cleanDir(f||'')+'»');if(s)sc.set(id,s);}
  /* bastano poche foto in una sottocartella "Neve" per non cambiare tema a tutto il libro */
  const best=[...sc].sort((a,b)=>b[1]-a[1])[0];
  if(best&&best[1]>=ph.length*.3)return{id:best[0],why:why.get(best[0])};
  /* altrimenti le date degli scatti (solo EXIF) */
  const ds=ph.filter(e=>e.dateSrc==='exif'&&e.date).map(e=>new Date(e.date));if(ds.length<Math.max(4,ph.length*.5))return null;
  const share=f=>ds.filter(f).length/ds.length,md=d=>(d.getMonth()+1)*100+d.getDate();
  const near=(d,t,k)=>Math.abs(d-t)<=k*864e5;
  const rules=[
    ['natale',d=>md(d)>=1215||md(d)<=106,'foto scattate tra metà dicembre e l’Epifania'],
    ['valentino',d=>md(d)>=210&&md(d)<=216,'foto scattate intorno a San Valentino'],
    ['papa',d=>md(d)>=318&&md(d)<=320,'foto scattate il 19 marzo'],
    ['pasqua',d=>near(d,easter(d.getFullYear()),1),'foto scattate a Pasqua'],
    ['mamma',d=>{const f=new Date(d.getFullYear(),4,1);const s2=new Date(d.getFullYear(),4,1+((7-f.getDay())%7)+7);return near(d,s2,1);},'foto scattate alla festa della mamma'],
    ['estate',d=>md(d)>=620&&md(d)<=915,'foto scattate in estate'],
    ['autunno',d=>md(d)>=1001&&md(d)<=1120,'foto scattate in autunno']];

/* sottotitolo dalle date: "14 giugno 2025", "giugno 2025", "giugno – luglio 2025", "2025", "2024 – 2025" */
function suggestSub(){
  const ds=realPhotos().filter(e=>e.date).map(e=>e.date).sort((a,b)=>a-b);if(!ds.length)return null;
  const q=p=>new Date(ds[Math.min(ds.length-1,Math.max(0,Math.round(p*(ds.length-1))))]);const a=q(.03),b=q(.97);
  const Y=a.getFullYear(),Y2=b.getFullYear(),M=a.getMonth(),M2=b.getMonth();
  if(Y!==Y2)return Y2-Y>3?null:`${Y} – ${Y2}`;
  if(M===M2&&a.getDate()===b.getDate())return`${a.getDate()} ${MESI[M]} ${Y}`;
  if(M===M2)return b.getDate()-a.getDate()<=3?`${a.getDate()}–${b.getDate()} ${MESI[M]} ${Y}`:`${MESI[M][0].toUpperCase()+MESI[M].slice(1)} ${Y}`;

window.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();const typing=tag==='input'||tag==='textarea'||tag==='select';
  if((e.ctrlKey||e.metaKey)&&!typing){const k=e.key.toLowerCase();
    if(k==='z'&&!e.shiftKey){e.preventDefault();undo();return;}
    if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();return;}
    if(k==='s'){e.preventDefault();saveProject();return;}
    if(k==='e'){e.preventDefault();openExport('print');return;}}
  if(typing||$('#dlg').open||$('#wiz').open||$('#flipDlg').open||START.open)return;
  if(e.key==='['){togglePanel('L');return;}
  if(e.key===']'){togglePanel('R');return;}
  if(e.key==='f'||e.key==='F'){toggleFocus();return;}
  if(e.key==='PageDown'){e.preventDefault();goSpread(UI.cur+1);return;}
  if(e.key==='PageUp'){e.preventDefault();goSpread(UI.cur-1);return;}
  if((e.key==='v'||e.key==='V')&&isSpecial(cur(),activeSide(cur()))){toast('Pagina speciale: si modifica dal pannello Pagine');return;}
  if(e.key==='v'||e.key==='V'){const sp=cur(),side=activeSide(sp),M=meta(sp,side),cands=pageCands(sp,side);if(cands.length){const i=cands.findIndex(c=>c.key===M.lay);relayoutPage(sp,side,{key:cands[(i+1)%cands.length].key});sel=null;commit();syncAll();}return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSelection();}
  else if(e.key==='Escape'){sel=null;TSEL.clear();renderProps();renderLeft();draw();}
  else if(e.key==='m'||e.key==='M'){setMode(UI.mode==='photo'?'layout':'photo');}
  else if(!sel&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){e.preventDefault();goSpread(UI.cur+(e.key==='ArrowRight'?1:-1));}
  else if(e.key.startsWith('Arrow')&&sel){e.preventDefault();const st=e.shiftKey?.05:.005;
    const dx=e.key==='ArrowLeft'?-st:e.key==='ArrowRight'?st:0,dy=e.key==='ArrowUp'?-st:e.key==='ArrowDown'?st:0;
    if(sel.type==='text'){const t=txtById(sel.id);t.x+=dx/2;t.y+=dy;}
    else if(sel.type==='deco'){const d=decoById(sel.id);d.x+=dx/2;d.y+=dy;}
    else{const c=byId(sel.id);if(UI.mode==='layout'){c.x=clamp(c.x+dx,0,1-c.w);c.y=clamp(c.y+dy,0,1-c.h);}
      else if(c.ph){c.ph.ox=clamp(c.ph.ox-dx*10,-1,1);c.ph.oy=clamp(c.ph.oy-dy*10,-1,1);}}
    draw();clearTimeout(wheelT);wheelT=setTimeout(()=>{commit();renderProps();},350);}
});
function deleteSelection(){
  if(!sel)return;const sp=cur();
  if(sel.type==='text'){sp.texts=sp.texts.filter(t=>t.id!==sel.id);sel=null;}
  else if(sel.type==='deco'){sp.decos=sp.decos.filter(t=>t.id!==sel.id);sel=null;}
  else{const c=byId(sel.id);if(!c)return;if(UI.mode==='photo')removeFromPage(c);else{sp.cells=sp.cells.filter(k=>k!==c);sel=null;}}
  commit();syncAll();
}

/* ============ foto di esempio ============ */
const SAMPLES=[
  {sky:['#F6C28B','#E9806E','#7A5C8C'],sun:'#FFF1C9',hills:['#6B5582','#45395E','#27213A']},
  {sky:['#CFEAF5','#8CC5E3','#4F8DB8'],sun:'#FFFFFF',hills:['#79AA82','#4F8160','#2F5A45']},
  {sky:['#FDE6C4','#F5B97A','#E07A4F'],sun:'#FFF6E0',hills:['#C96B4B','#8E4A3A'],sea:'#3E6E8E'},
  {sky:['#1F2A4A','#3B4C7A','#C98BA1'],sun:'#F7E7C6',hills:['#2A3558','#1A2240','#0E1426']},
  {sky:['#EEF4E8','#C9DFC3','#9CC3A8'],sun:'#FFFDF2',hills:['#7BA98A','#557F68','#36584A']},
  {sky:['#F3D9E2','#E4AFC3','#B9789B'],sun:'#FFF3F6',hills:['#8F5778','#6A3E5A'],sea:'#5A6F9E'},
];
function drawSample(pi,seed,W,H,veil){
  const p=SAMPLES[pi%SAMPLES.length],R=rng(seed*977+13),c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');
  let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,p.sky[2]);g.addColorStop(.45,p.sky[1]);g.addColorStop(.75,p.sky[0]);
  x.fillStyle=g;x.fillRect(0,0,W,H);
  const sx=W*(.25+R()*.5),sy=H*(.3+R()*.15),sr=Math.min(W,H)*(.07+R()*.05);
  const halo=x.createRadialGradient(sx,sy,sr*.5,sx,sy,sr*5);halo.addColorStop(0,p.sun+'aa');halo.addColorStop(1,p.sun+'00');
  x.fillStyle=halo;x.fillRect(0,0,W,H);
  x.fillStyle=p.sun;x.beginPath();x.arc(sx,sy,sr,0,7);x.fill();
  if(p.sea){const top=H*.66;const sg=x.createLinearGradient(0,top,0,H);sg.addColorStop(0,p.sea);sg.addColorStop(1,'#1d2c3c');x.fillStyle=sg;x.fillRect(0,top,W,H-top);
    x.fillStyle=p.sun+'99';for(let k=0;k<18;k++){const yy=top+8+k*k*1.6;const ww=sr*(1.6-k*.06)*(0.6+R()*.6);x.fillRect(sx-ww/2,yy,ww,3+k*.25);}}
  const base=p.sea?[.6,.66]:[.55,.68,.82];
  p.hills.forEach((col,k)=>{const by=H*base[k];const a1=R()*6,a2=R()*6,f1=1+R()*2,f2=3+R()*3,amp=H*(.05+R()*.05);
    x.fillStyle=col;x.beginPath();x.moveTo(0,H);
    for(let xx=0;xx<=W;xx+=8){const t=xx/W;x.lineTo(xx,by-Math.sin(t*Math.PI*f1+a1)*amp-Math.sin(t*Math.PI*f2+a2)*amp*.35);}
    x.lineTo(W,H);x.closePath();x.fill();});
  if(veil){x.fillStyle='rgba(255,255,255,.05)';x.fillRect(0,0,W,H);}
  return c;
}
async function makeSamples(){
  const base=new Date(2026,6,10,9,0).getTime();const plan=[9,8,7];let n=0;
  progress('Preparo un libro di esempio…',0,26);
  for(let d=0;d<plan.length;d++)for(let k=0;k<plan[d];k++){
    const portrait=(n%3===1),W=portrait?800:1200,H=portrait?1100:800,t=base+d*86400000+k*2400000;
    const burst=(d===0&&k===3)?2:1;
    for(let b=0;b<burst;b++){const c=drawSample(n,n+1,W,H,b>0);const blob=await toBlob(c,'image/jpeg',.86);
      const f=new File([blob],`esempio-${String(n+1).padStart(2,'0')}${b?'-bis':''}.jpg`,{type:'image/jpeg',lastModified:t+b*3000});
      const e=await ingest(f,{id:uid(),fav:n===2||n===13,excl:false,exclWhy:'',sample:true});e.sample=true;progress('Preparo un libro di esempio…',LIB.size,26);}
    n++;}
  progress(null);
}
